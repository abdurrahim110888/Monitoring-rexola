<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Sales Deodorant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#667085;--pr:#0f766e;--prt:#fff;--bd:#e3e8ee;--rd:#dc2626;--rdb:#fee2e2;--gn:#15803d;--gnb:#dcfce7;--yl:#b45309;--ylb:#fef3c7;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mu:#97a3b2;--pr:#2dd4bf;--prt:#06312d;--bd:#2c3744;--rd:#f87171;--rdb:#451a1a;--gn:#4ade80;--gnb:#14301f;--yl:#fbbf24;--ylb:#3a2a0a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}
button,.btn{font:inherit;background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.sm{padding:6px 10px;font-size:13px}button:disabled{opacity:.45}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mu)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600;background:var(--ylb);color:var(--yl);white-space:nowrap}
.badge.r{background:var(--rdb);color:var(--rd)}.badge.g{background:var(--gnb);color:var(--gn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.big{font-size:20px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--pr)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}
.ok{color:var(--gn)}.no{color:var(--rd)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
img.ph{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{max-width:340px;width:100%;text-align:center}
a{color:var(--pr)}video{width:100%;border-radius:10px}
</style>
</head>
<body>
<div id="app" style="padding:16px">Memuat aplikasi... (jika tulisan ini tidak hilang, JavaScript tidak berjalan)</div><script>window.onerror=function(m,s,l){var a=document.getElementById("app");if(a)a.innerHTML="<pre style=\"white-space:pre-wrap;color:#b00;padding:12px\">ERROR: "+m+" (baris "+l+")</pre>"}</script><noscript>JavaScript dimatikan di browser Anda.</noscript>
<script>
const PRICE=8000,COST=3000,COMM=5000,INT=14,TARGET=10,RADIUS=100,MAXACC=60;
const $=s=>document.querySelector(s);
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const iso=d=>d.toISOString().slice(0,10);
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const diff=s=>Math.round((new Date(s+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5);
let db,me=null,tab='jadwal',mem={},q='',flt='',sel=null;
function seed(){
  const S=[['Toko Maju Jaya','Pak Hasan','0812111','Budi',-1,6,[5,3]],['Warung Bu Sri','Bu Sri','0813222','Budi',0,2,[4,4]],['Kios Berkah','Pak Dedi','0857333','Budi',6,5,[1,0]],['Toko Sinar','Ko Ahong','0821444','Sari',3,4,[4,5]],['Warung Mawar','Bu Ani','0819555','Sari',-3,3,[2,1]]];
  const stores=[],visits=[];
  S.forEach((s,i)=>{const id='TK-'+String(i+1).padStart(3,'0');
    stores.push({id,name:s[0],owner:s[1],phone:s[2],sales:s[3],lat:-6.2+i*.01,lng:106.8+i*.01,stock:s[5],owed:s[6][0]*PRICE*0.2,next:addD(TODAY,s[4]),photo:'',selfie:'',seed:true});
    s[6].forEach((sold,k)=>visits.push({id:id+k,store:id,sales:s[3],date:addD(TODAY,-14*(s[6].length-k)),sold,added:sold,cash:sold*PRICE,comm:COMM,ok:true,reg:false,lat:-6.2,lng:106.8,selfie:''}))});
  return{stores,visits}}
function load(){try{const x=JSON.parse(localStorage.getItem('dstv1'));if(x)return x}catch(e){}return seed()}
function save(){try{localStorage.setItem('dstv1',JSON.stringify(db))}catch(e){}}
function toast(m){let t=$('#tst');if(!t){t=document.createElement('div');t.id='tst';t.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:20;font-size:14px';t.onclick=()=>t.remove();document.body.appendChild(t)}t.textContent=m;clearTimeout(t._h);t._h=setTimeout(()=>t.remove(),9000)}
function img(f){return new Promise(r=>{if(!f)return r('');const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=240/Math.max(i.width,i.height,240);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r('');i.src=fr.result};fr.readAsDataURL(f)})}
function gps(cb){
  if(!navigator.geolocation)return toast('GPS tidak tersedia di perangkat ini');
  mem.gpsBusy=1;mem.lat=0;mem.acc=0;render2();let best=null,n=0;
  const id=navigator.geolocation.watchPosition(p=>{
    n++;const c=p.coords;if(!best||c.accuracy<best.accuracy)best=c;
    mem.lat=best.latitude;mem.lng=best.longitude;mem.acc=best.accuracy;mem.gt=Date.now();
    if(best.accuracy<=MAXACC||n>=8){navigator.geolocation.clearWatch(id);mem.gpsBusy=0;render2();if(best.accuracy>MAXACC)toast('Sinyal GPS lemah (akurasi '+Math.round(best.accuracy)+' m). Pindah ke tempat terbuka lalu coba lagi.');cb&&cb(mem.lat,mem.lng)}else render2()
  },e=>{navigator.geolocation.clearWatch(id);mem.gpsBusy=0;mem.lat=0;render2();toast(e.code==1?(window.top!==window?'Lokasi diblokir karena halaman ini dibuka di dalam Claude. Simpan file dan pasang di web sendiri (https) agar GPS dan kamera aktif.':'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini dan nyalakan GPS.'):'Lokasi tidak bisa didapat. Nyalakan GPS lalu coba lagi.')},{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
const mapA=(a,b)=>`<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${a},${b}">Peta</a>`;
function lastTwo(id){return db.visits.filter(v=>v.store===id&&!v.reg).sort((a,b)=>a.date<b.date?1:-1).slice(0,2)}
const weak=id=>{const v=lastTwo(id);return v.length==2&&v.every(x=>x.sold<2)};
function status(s){const d=diff(s.next);return d<0?['Terlambat '+(-d)+' hr','r']:d==0?['Hari ini','g']:d<=2?['Besok/lusa','']:['Dalam '+d+' hari','']}

function login(){
  $('#app').innerHTML=`<h1>Monitoring Sales Deodorant</h1><p class="mu">Prototype. Pilih akun untuk masuk (PIN demo: 1234).</p>
  <div class="card"><label>Akun</label><select id="u"><option>Budi</option><option>Sari</option><option value="admin">Admin (pemilik)</option></select>
  <label>PIN</label><input id="p" type="password" inputmode="numeric" value="1234"><button style="width:100%" onclick="doLogin()">Masuk</button></div>
  <p class="mu">Aturan: harga titip ${rp(PRICE)}, komisi ${rp(COMM)} per kunjungan terverifikasi (selfie + GPS + scan QR) sesuai jadwal tiap ${INT} hari.</p>
  <button class="sec sm" onclick="if(confirm('Reset semua data demo?')){db=seed();save();toast('Data direset')}">Reset data demo</button>`}
function doLogin(){if($('#p').value!=='1234')return toast('PIN salah');me=$('#u').value;tab=me==='admin'?'ring':'jadwal';render()}
function nav(items){return `<nav>${items.map(i=>`<button class="${tab==i[0]?'on':''}" onclick="tab='${i[0]}';q='';flt='';render()">${i[1]}</button>`).join('')}</nav>`}
function head(){return `<div class="row"><h1>${me==='admin'?'Admin':'Halo, '+me}</h1><button class="sec sm" onclick="me=null;login()">Keluar</button></div>`}
function render(){
  if(!me)return login();
  db.stores.forEach(s=>{});
  const A=$('#app');
  if(me==='admin'){A.innerHTML=head()+admin()+nav([['ring','Ringkasan'],['cust','Pelanggan'],['rank','Sales'],['log','Riwayat']]);return}
  const nv=nav([['jadwal','Jadwal'],['toko','Toko'],['komisi','Komisi']]);
  A.innerHTML=head()+({jadwal,toko,komisi,visit,add}[tab]||jadwal)()+nv}

function jadwal(){return box('Cari toko, pemilik, HP...')+'<div id="lst">'+jl()+'</div>'}
function jl(){
  const L=db.stores.filter(s=>s.sales===me&&mq(s)).sort((a,b)=>a.next<b.next?-1:1);
  const due=L.filter(s=>diff(s.next)<=0).length;
  return `<p class="mu">Kunjungan terjadwal tiap ${INT} hari. ${due} toko perlu dikunjungi sekarang.</p>`+(L.map(s=>{const[t,c]=status(s);return `<div class="card"><div class="row"><b>${s.name}</b><span class="badge ${c}">${t}</span></div>
  <div class="mu">Jadwal ${s.next} · stok titip ${s.stock} btl · piutang ${rp(s.owed)}</div>
  <div class="row" style="margin-top:8px"><span>${weak(s.id)?'<span class="badge r">Penjualan lemah</span>':''}</span><button class="sm" onclick="mem={id:'${s.id}'};tab='visit';render()">Kunjungi</button></div></div>`}).join('')||'<div class="card">Belum ada toko.</div>')}

function toko(){
  const A=db.stores.filter(s=>s.sales===me);
  return `<div class="row"><p class="mu">${A.length} / ${TARGET} toko (target)</p><button class="sm" onclick="mem={};tab='add';render()">+ Toko baru</button></div>
  <div class="bar"><i style="width:${Math.min(100,A.length/TARGET*100)}%"></i></div>`+box('Cari toko, pemilik, HP...')+'<div id="lst">'+tl()+'</div>'}
function tl(){const L=db.stores.filter(s=>s.sales===me&&mq(s));return L.map(s=>`<div class="card"><div class="row"><div><b>${s.name}</b><div class="mu">${s.owner} · ${s.phone}</div><div class="mu">${mapA(s.lat,s.lng)} · ${s.id}</div></div>${s.photo?`<img class="ph" src="${s.photo}">`:''}</div>
  <button class="sec sm" style="margin-top:8px" onclick="showQR('${s.id}')">Lihat QR toko</button></div>`).join('')}

function showQR(id){const s=db.stores.find(x=>x.id==id);const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card"><b>${s.name}</b><div id="qr" style="display:inline-block;background:#fff;padding:10px;margin:10px"></div><div><b>${s.id}</b></div><p class="mu">Cetak dan tempel di toko. Scan saat kunjungan.</p><button onclick="this.closest('.ov').remove()">Tutup</button></div>`;document.body.appendChild(o);try{new QRCode(o.querySelector('#qr'),{text:s.id,width:150,height:150})}catch(e){}}

function chk(k,l){return `<div class="${mem[k]?'ok':'no'}">${mem[k]?'✓':'✗'} ${l}</div>`}
function add(){window.vk=0;return `<h2>Daftarkan toko baru</h2><div class="card">
  <label>Nama toko</label><input id="n"><label>Nama pemilik</label><input id="o"><label>No. HP</label><input id="h" inputmode="tel">
  <label>Titip awal (botol, saran 5-6)</label><input id="st" type="number" value="6">
  <label>Foto toko (kamera langsung, ambil GPS dulu)</label><button class="sec sm" onclick="shoot('photo','environment')">Buka kamera belakang</button>
  <label>Selfie di depan toko (kamera langsung)</label><button class="sec sm" onclick="shoot('selfie','user')">Buka kamera depan</button>
  <button class="sec sm" onclick="gps()">Ambil lokasi GPS (berdiri di depan toko)</button>
  <div id="ck" style="margin:10px 0">${ck()}</div>
  <div class="row"><button class="sec" onclick="tab='toko';render()">Batal</button><button onclick="saveStore()">Simpan</button></div></div>`}
const cg=(ok,l)=>`<div class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${l}</div>`;
const gok=()=>!!mem.lat&&mem.acc>0&&mem.acc<=MAXACC;
const gtxt=()=>mem.gpsBusy&&!mem.lat?'GPS mencari sinyal...':mem.lat?'GPS akurasi ±'+Math.round(mem.acc)+' m'+(mem.acc>MAXACC?' (terlalu lemah, maks '+MAXACC+' m)':'')+(mem.gpsBusy?' (menyempurnakan...)':''):'GPS belum diambil';
const lv=k=>mem[k]&&mem[k+'Live']===false?' (kamera sistem, ditandai)':'';
const pv=k=>mem[k]?`<img class="ph" src="${mem[k]}" style="margin-right:6px">`:'';
function ck(){return cg(gok(),gtxt())+chk('photo','Foto toko'+lv('photo'))+chk('selfie','Selfie'+lv('selfie'))+pv('photo')+pv('selfie')}
function render2(){const e=$('#ck');if(e)e.innerHTML=window.vk?vck():ck()}
async function up(k,el){mem[k]=await img(el.files[0]);render2()}
function saveStore(){
  const n=$('#n').value.trim();if(!n)return toast('Isi nama toko');
  if(!mem.photo||!mem.selfie||!gok())return toast('Foto toko, selfie, dan GPS akurat wajib');
  const id='TK-'+String(db.stores.length+1).padStart(3,'0'),st=+$('#st').value||0;
  db.stores.push({id,name:n,owner:$('#o').value,phone:$('#h').value,sales:me,lat:mem.lat,lng:mem.lng,stock:st,owed:st*PRICE,next:addD(TODAY,INT),photo:mem.photo,selfie:mem.selfie});
  db.visits.push({id:id+'r',store:id,sales:me,date:TODAY,sold:0,added:st,cash:0,comm:COMM,ok:true,reg:true,lat:mem.lat,lng:mem.lng,selfie:mem.selfie,dist:0,acc:Math.round(mem.acc),live:mem.selfieLive!==false&&mem.photoLive!==false});
  save();mem={};tab='toko';render();showQR(id)}

function visit(){
  window.vk=1;const s=db.stores.find(x=>x.id==mem.id);
  return `<h2>Kunjungan: ${s.name}</h2><div class="card"><div class="mu">Stok titip tercatat ${s.stock} btl · piutang ${rp(s.owed)} · jadwal ${s.next}</div></div>
  <div class="card"><label>1. Scan QR toko</label><div class="row"><input id="qc" placeholder="Kode toko" oninput="mem.qr=this.value.trim().toUpperCase()==='${s.id}';render2()"><button class="sm" onclick="scanQR()" style="margin-bottom:6px">Scan</button></div>
  <label class="mu">Demo tanpa kamera: <a href="#" onclick="$('#qc').value='${s.id}';mem.qr=true;render2();return false">isi kode otomatis</a></label>
  <label>2. Lokasi GPS (wajib aktif, maks ${RADIUS} m dari toko)</label><button class="sec sm" onclick="gps()">Ambil lokasi GPS</button>
  <label>3. Selfie di toko (kamera langsung)</label><button class="sec sm" onclick="shoot('selfie','user')">Buka kamera depan</button>
  <div id="ck" style="margin:10px 0">${vck()}</div></div>
  <div class="card"><label>Botol terjual sejak kunjungan lalu</label><input id="sold" type="number" min="0" max="${s.stock}" value="0" oninput="calc()">
  <label>Uang yang ditagih (Rp)</label><input id="cash" type="number" min="0" value="0" oninput="calc()">
  <label>Tambah titipan (botol)</label><input id="addq" type="number" min="0" value="0" oninput="calc()">
  <div id="sm" class="mu"></div></div>
  <div class="row"><button class="sec" onclick="window.vk=0;tab='jadwal';render()">Batal</button><button onclick="saveVisit()">Simpan kunjungan</button></div>`}
function dist(){const s=db.stores.find(x=>x.id==mem.id);if(!s||!mem.lat)return null;if(s.seed)return 0;const r=Math.PI/180,dl=(mem.lat-s.lat)*r,dn=(mem.lng-s.lng)*r,a=Math.sin(dl/2)**2+Math.cos(s.lat*r)*Math.cos(mem.lat*r)*Math.sin(dn/2)**2;return 2*6371000*Math.asin(Math.sqrt(a))}
function vck(){const d=dist(),s=db.stores.find(x=>x.id==mem.id),ok=d!==null&&d<=RADIUS;return chk('qr','QR cocok')+cg(gok(),gtxt())+(mem.lat&&mem.acc?cg(ok,s&&s.seed?'Jarak: toko contoh (dilewati)':'Jarak ke toko '+Math.round(d)+' m (maks '+RADIUS+' m)'):'')+chk('selfie','Selfie kamera langsung'+lv('selfie'))+pv('selfie')}
function calc(){const s=db.stores.find(x=>x.id==mem.id),so=+$('#sold').value||0,c=+$('#cash').value||0;const inS=diff(s.next)<=2;
  $('#sm').innerHTML=`Tagihan ${rp(so*PRICE)} · piutang baru ${rp(s.owed+so*PRICE-c)}<br>Komisi: ${inS?rp(COMM)+' (sesuai jadwal)':'<span class="no">Rp0 (di luar jadwal)</span>'}${so<2?'<br><span class="no">Penjualan di bawah 2 botol</span>':''}`}
setTimeout(()=>{},0);
function saveVisit(){
  const s=db.stores.find(x=>x.id==mem.id),so=+$('#sold').value||0,c=+$('#cash').value||0,ad=+$('#addq').value||0;
  if(!mem.qr||!mem.selfie||!gok())return toast('QR, selfie, dan GPS akurat wajib untuk verifikasi');
  if(Date.now()-mem.gt>600000)return toast('Lokasi kedaluwarsa, ambil ulang GPS');
  const d=dist();if(d>RADIUS)return toast('Anda berada '+Math.round(d)+' m dari toko. Harus dalam '+RADIUS+' m.');
  if(so>s.stock)return toast('Terjual melebihi stok titip ('+s.stock+')');
  const inS=diff(s.next)<=2;
  db.visits.push({id:s.id+Date.now(),store:s.id,sales:me,date:TODAY,sold:so,added:ad,cash:c,comm:inS?COMM:0,ok:true,reg:false,lat:mem.lat,lng:mem.lng,selfie:mem.selfie,dist:Math.round(d),acc:Math.round(mem.acc),live:mem.selfieLive!==false});
  s.stock=s.stock-so+ad;s.owed=s.owed+so*PRICE-c+ad*0;s.next=addD(TODAY,INT);
  save();window.vk=0;mem={};tab='jadwal';render();toast('Kunjungan tersimpan. Jadwal berikutnya '+s.next)}
async function scanQR(){
  if(!('BarcodeDetector' in window))return toast('Browser ini belum mendukung scan. Ketik kode toko.');
  const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="card"><video autoplay playsinline></video><button class="sec" style="margin-top:8px">Tutup</button></div>';document.body.appendChild(o);
  let st;const v=o.querySelector('video'),stop=()=>{st&&st.getTracks().forEach(t=>t.stop());o.remove()};o.querySelector('button').onclick=stop;
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=st;const d=new BarcodeDetector({formats:['qr_code']});
  const t=setInterval(async()=>{if(!document.body.contains(o))return clearInterval(t);const r=await d.detect(v).catch(()=>[]);if(r.length){clearInterval(t);$('#qc').value=r[0].rawValue;$('#qc').dispatchEvent(new Event('input'));stop()}},400)}catch(e){stop();toast('Kamera tidak bisa dibuka')}}

function komisi(){
  const V=db.visits.filter(v=>v.sales===me).sort((a,b)=>a.date<b.date?1:-1),m=TODAY.slice(0,7);
  const tot=V.filter(v=>v.date.startsWith(m)).reduce((a,v)=>a+v.comm,0),bot=V.filter(v=>v.date.startsWith(m)).reduce((a,v)=>a+v.sold,0);
  const mine=db.stores.filter(s=>s.sales===me).length;
  return `<div class="grid"><div class="card"><div class="mu">Komisi bulan ini</div><div class="big">${rp(tot)}</div></div><div class="card"><div class="mu">Botol terjual</div><div class="big">${bot}</div></div></div>
  <div class="card" style="margin-top:10px"><div class="row"><span>Target toko</span><b>${mine}/${TARGET}</b></div><div class="bar"><i style="width:${Math.min(100,mine*10)}%"></i></div></div>
  <h2>Riwayat</h2>`+V.map(v=>{const s=db.stores.find(x=>x.id==v.store);return `<div class="card"><div class="row"><b>${s?s.name:v.store}</b><span class="badge ${v.comm?'g':'r'}">${rp(v.comm)}</span></div><div class="mu">${v.date} · ${v.reg?'Pendaftaran':'terjual '+v.sold+' btl'} · tagih ${rp(v.cash)}</div></div>`}).join('')}

function stats(){return db.visits.length?{}:{}}
function admin(){
  if(tab==='rank')return rank();if(tab==='log')return log();if(tab==='cust')return cust();if(tab==='sal')return salDetail();
  const sold=db.visits.reduce((a,v)=>a+v.sold,0),comm=db.visits.reduce((a,v)=>a+v.comm,0),owed=db.stores.reduce((a,s)=>a+s.owed,0),stk=db.stores.reduce((a,s)=>a+s.stock,0);
  const profit=sold*(PRICE-COST)-comm,late=db.stores.filter(s=>diff(s.next)<0),wk=db.stores.filter(s=>weak(s.id));
  return `<div class="grid"><div class="card"><div class="mu">Toko aktif</div><div class="big">${db.stores.length}</div></div><div class="card"><div class="mu">Botol terjual</div><div class="big">${sold}</div></div>
  <div class="card"><div class="mu">Laba bersih (setelah komisi)</div><div class="big">${rp(profit)}</div></div><div class="card"><div class="mu">Komisi dibayar</div><div class="big">${rp(comm)}</div></div>
  <div class="card"><div class="mu">Piutang di toko</div><div class="big">${rp(owed)}</div></div><div class="card"><div class="mu">Stok di toko (modal ${rp(stk*COST)})</div><div class="big">${stk} btl</div></div></div>
  <h2>Perlu perhatian</h2>`+[...late.map(s=>[s,'Terlambat '+(-diff(s.next))+' hari','r']),...wk.map(s=>[s,'Terjual &lt;2 btl dua siklus','r'])].map(x=>`<div class="card"><div class="row"><b>${x[0].name}</b><span class="badge r">${x[1]}</span></div><div class="mu">Sales ${x[0].sales} · stok ${x[0].stock} · ${mapA(x[0].lat,x[0].lng)}</div></div>`).join('')||'<div class="card ok">Semua aman.</div>'}
function rank(){
  const names=[...new Set(db.stores.map(s=>s.sales))];
  const R=names.map(n=>{const st=db.stores.filter(s=>s.sales===n),V=db.visits.filter(v=>v.sales===n);return{n,t:st.length,sold:V.reduce((a,v)=>a+v.sold,0),comm:V.reduce((a,v)=>a+v.comm,0),late:st.filter(s=>diff(s.next)<0).length,owed:st.reduce((a,s)=>a+s.owed,0)}}).sort((a,b)=>b.sold-a.sold);
  return `<h2>Ranking sales</h2>`+R.map((r,i)=>`<div class="card"><div class="row"><b>${i+1}. ${r.n}</b><span class="badge ${r.late?'r':'g'}">${r.late?r.late+' terlambat':'Tepat jadwal'}</span></div>
  <div class="mu">Toko ${r.t}/${TARGET}</div><div class="bar"><i style="width:${Math.min(100,r.t*10)}%"></i></div>
  <div class="mu">Terjual ${r.sold} btl · komisi ${rp(r.comm)} · piutang ${rp(r.owed)}</div><button class="sec sm" style="margin-top:8px" onclick="sel='${r.n}';tab='sal';render()">Lihat detail kinerja</button></div>`).join('')}
function log(){
  const V=[...db.visits].sort((a,b)=>a.date<b.date?1:-1).slice(0,30);
  return `<h2>Riwayat kunjungan</h2><div class="card scroll"><table><tr><th>Tgl</th><th>Sales</th><th>Toko</th><th>Jual</th><th>Tagih</th><th>Komisi</th><th>Foto</th><th>Jarak</th><th>Lokasi</th></tr>`+V.map(v=>{const s=db.stores.find(x=>x.id==v.store);return `<tr><td>${v.date}</td><td>${v.sales}</td><td>${s?s.name:v.store}</td><td>${v.sold}</td><td>${rp(v.cash)}</td><td>${rp(v.comm)}</td><td>${v.selfie?`<img class="ph" style="width:34px;height:34px" src="${v.selfie}" onclick="zoom(this.src)">`:'-'}</td><td>${v.dist===undefined?'-':v.dist+' m'}${v.live===false?' ⚠':''}</td><td>${mapA(v.lat,v.lng)}</td></tr>`}).join('')+`</table></div>`}
function box(ph){return `<input id="q" type="search" placeholder="${ph}" value="${q.replace(/"/g,'&quot;')}" oninput="q=this.value;upd()">`}
function mq(s){const k=q.trim().toLowerCase();return !k||[s.name,s.owner,s.phone,s.id,s.sales].join(' ').toLowerCase().includes(k)}
function upd(){const f={jadwal:jl,toko:tl,cust:cl}[tab],e=$('#lst');if(f&&e)e.innerHTML=f()}
function cust(){
  const names=[...new Set(db.stores.map(s=>s.sales))];
  return `<h2>Semua pelanggan</h2>`+box('Cari toko, pemilik, HP, kode, sales...')+`<select onchange="flt=this.value;upd()"><option value="">Semua sales</option>${names.map(n=>`<option ${flt===n?'selected':''}>${n}</option>`).join('')}</select><div id="lst">${cl()}</div>`}
function cl(){
  const L=db.stores.filter(s=>mq(s)&&(!flt||s.sales===flt)).sort((a,b)=>a.next<b.next?-1:1);
  return `<p class="mu">${L.length} toko ditemukan</p>`+(L.map(s=>{const[t,c]=status(s),lv=lastTwo(s.id)[0];return `<div class="card"><div class="row"><b>${s.name}</b><span class="badge ${c}">${t}</span></div><div class="mu">${s.owner} · ${s.phone} · ${s.id}</div><div class="mu">Sales ${s.sales} · stok ${s.stock} btl · piutang ${rp(s.owed)}</div><div class="mu">Kunjungan terakhir: ${lv?lv.date+' (terjual '+lv.sold+')':'-'} · ${mapA(s.lat,s.lng)}</div>${weak(s.id)?'<span class="badge r">Penjualan lemah</span>':''}</div>`}).join('')||'<div class="card">Tidak ditemukan.</div>')}
function salDetail(){
  const n=sel,st=db.stores.filter(s=>s.sales===n),V=db.visits.filter(v=>v.sales===n).sort((a,b)=>a.date<b.date?1:-1),m=TODAY.slice(0,7);
  const sold=V.reduce((a,v)=>a+v.sold,0),comm=V.reduce((a,v)=>a+v.comm,0),cm=V.filter(v=>v.date.startsWith(m)).reduce((a,v)=>a+v.comm,0),owed=st.reduce((a,s)=>a+s.owed,0),late=st.filter(s=>diff(s.next)<0).length,off=V.filter(v=>!v.comm).length;
  return `<button class="sec sm" onclick="tab='rank';render()">← Kembali</button><h2>Kinerja ${n}</h2>
  <div class="grid"><div class="card"><div class="mu">Toko</div><div class="big">${st.length}/${TARGET}</div></div><div class="card"><div class="mu">Botol terjual</div><div class="big">${sold}</div></div>
  <div class="card"><div class="mu">Komisi bulan ini</div><div class="big">${rp(cm)}</div></div><div class="card"><div class="mu">Komisi total</div><div class="big">${rp(comm)}</div></div>
  <div class="card"><div class="mu">Piutang</div><div class="big">${rp(owed)}</div></div><div class="card"><div class="mu">Laba untuk Anda</div><div class="big">${rp(sold*(PRICE-COST)-comm)}</div></div></div>
  <div class="card" style="margin-top:10px"><div class="mu">${late} toko terlambat · ${off} kunjungan di luar jadwal/tanpa komisi · ${V.length} kunjungan tercatat</div></div>
  <h2>Toko ${n}</h2>`+(st.map(s=>{const[t,c]=status(s),lv=lastTwo(s.id)[0];return `<div class="card"><div class="row"><b>${s.name}</b><span class="badge ${c}">${t}</span></div><div class="mu">Stok ${s.stock} · piutang ${rp(s.owed)} · terakhir ${lv?lv.date+' jual '+lv.sold:'-'} · ${mapA(s.lat,s.lng)}</div>${weak(s.id)?'<span class="badge r">Penjualan lemah</span>':''}</div>`}).join('')||'<div class="card">Belum ada toko.</div>')+`<h2>Kunjungan terbaru</h2><div class="card scroll"><table><tr><th>Tgl</th><th>Toko</th><th>Jual</th><th>Tagih</th><th>Komisi</th><th>Foto</th></tr>${V.slice(0,10).map(v=>{const s=db.stores.find(x=>x.id==v.store);return `<tr><td>${v.date}</td><td>${s?s.name:v.store}</td><td>${v.sold}</td><td>${rp(v.cash)}</td><td>${rp(v.comm)}</td><td>${v.selfie?`<img class="ph" style="width:34px;height:34px" src="${v.selfie}">`:'-'}</td></tr>`}).join('')}</table></div>`}
function stamp(c){const x=c.getContext('2d'),h=44;x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,c.height-h,c.width,h);x.fillStyle='#fff';x.font='13px sans-serif';x.fillText(new Date().toLocaleString('id-ID')+' · '+me,8,c.height-26);x.fillText(mem.lat?'GPS '+mem.lat.toFixed(5)+', '+mem.lng.toFixed(5)+' ±'+Math.round(mem.acc)+' m':'GPS -',8,c.height-9)}
function camShot(face){return new Promise(res=>{
  const o=document.createElement('div');o.className='ov';
  o.innerHTML='<div class="card"><video autoplay playsinline muted></video><div class="mu" id="cm">Membuka kamera...</div><div class="row" style="margin-top:8px"><button class="sec" id="cx">Batal</button><button id="cs" disabled>Ambil foto</button></div></div>';
  document.body.appendChild(o);const v=o.querySelector('video');let st=null;
  const close=()=>{st&&st.getTracks().forEach(t=>t.stop());o.remove()};
  const done=(src,live)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=480;c.height=Math.round(480*i.height/i.width);c.getContext('2d').drawImage(i,0,0,c.width,c.height);stamp(c);close();res({data:c.toDataURL('image/jpeg',.7),live})};i.src=src};
  o.querySelector('#cx').onclick=()=>{close();res(null)};
  o.querySelector('#cs').onclick=()=>{const c=document.createElement('canvas');c.width=480;c.height=Math.round(480*v.videoHeight/v.videoWidth)||360;c.getContext('2d').drawImage(v,0,0,c.width,c.height);stamp(c);close();res({data:c.toDataURL('image/jpeg',.7),live:true})};
  const fb=()=>{st&&st.getTracks().forEach(t=>t.stop());v.remove();o.querySelector('#cm').innerHTML='Kamera langsung tidak diizinkan. Pakai kamera sistem (akan ditandai di laporan admin):<input type="file" accept="image/*" capture="'+(face==='user'?'user':'environment')+'" id="ff">';o.querySelector('#ff').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>done(fr.result,false);fr.readAsDataURL(f)}};
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return fb();
  navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:false}).then(s=>{st=s;v.srcObject=s;o.querySelector('#cs').disabled=false;o.querySelector('#cm').textContent='Kamera aktif. Arahkan lalu ambil foto.'}).catch(fb)})}
async function shoot(k,face){
  if(!gok())return toast('Ambil lokasi GPS dulu (akurasi harus baik) sebelum foto, agar foto bercap lokasi.');
  const r=await camShot(face);if(r){mem[k]=r.data;mem[k+'Live']=r.live}render2()}
function zoom(src){const o=document.createElement('div');o.className='ov';o.onclick=()=>o.remove();o.innerHTML='<img src="'+src+'" style="max-width:100%;border-radius:10px">';document.body.appendChild(o)}
db=load();render();
</script>
</body>
